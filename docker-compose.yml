# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mindscroll
    ports:
      - "5432:5432"
    volumes:
      - mindscroll-data:/var/lib/postgresql/data

volumes:
  mindscroll-data:
